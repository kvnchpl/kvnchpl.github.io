name: Check consolidated projects
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install submission function dependencies
        run: npm ci --prefix each-all/netlify/functions
      - name: Check project links and visibility
        run: node project-tools/check-projects.mjs
      - name: Test backend integration
        run: node --test project-tools/*.test.cjs
      - name: Test Each All submissions and assets
        run: npm --prefix each-all test
      - name: Validate map data
        run: npm --prefix desire-path test
      - name: Build Netlify publishing directories
        run: |
          node each-all/scripts/build.cjs
          node ephemeris/scripts/build.cjs
