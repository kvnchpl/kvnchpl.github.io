name: Check site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check scripts/build-site.mjs
          node --check scripts/check-site.mjs
          node --check js/main.js
          node --check js/compiler-buddha.js
      - name: Build generated files
        run: node scripts/build-site.mjs
      - name: Verify generated files are committed
        run: git diff --exit-code
      - name: Check links and asset versions
        run: node scripts/check-site.mjs
