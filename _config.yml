# Publish site files only; exclude authoring tools, backend source, and archives.
exclude:
  - .private
  - .gitignore
  - .repo-backups
  - .codex
  - .agents
  - README.md
  - AGENTS.md
  - package.json
  - package-lock.json
  - scripts
  - hosting
  - docs
  - thoughts.html
  - node_modules
  - artifacts
  - qa
  - test-results
  - playwright-report
  - coverage
  - "*.log"
  - "*.tmp"
  - "*.har"
  - "*.trace"
  # Required backend/build inputs are tracked but excluded from Pages.
  - each-all/netlify
  - each-all/tests
  - each-all/netlify.toml
  - ephemeris/netlify
  - ephemeris/netlify.toml
  - jungle/visualize_links.py
  - jungle/zine_graph.dot
  - jungle/zine_graph.png
  - trellis/vary_colors.py
  - desire-path/data/encounters.csv
  - desire-path/data/encounters-summary.md
  - desire-path/.editorconfig
  - desire-path/.gitattributes
  - "**/README.md"
  - "**/package.json"
  - "**/package-lock.json"
  - "**/scripts"
  - "**/node_modules"
  - "**/dist"

# json/nav.json is public: the separately hosted Thoughts theme reads it.
