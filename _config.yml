# Publish site files only. Authoring tools and archives remain local.
exclude:
  - .private
  - .archive
  - .gitignore
  - .repo-backups
  - .codex
  - .agents
  - README.md
  - package.json
  - package-lock.json
  - scripts
  - docs
  - thoughts.html
  - node_modules
  - artifacts
  - qa
  - test-results
  - playwright-report
  - coverage
  - "*.log"
  - "*.tmp"
  - "*.har"
  - "*.trace"

# json/nav.json is public: the separately hosted Thoughts theme reads it.
