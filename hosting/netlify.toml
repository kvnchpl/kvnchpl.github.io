# Portfolio only. Select "hosting" as the package directory, with the repository
# root as the base directory. Keeping this out of root isolates the other sites.
[build]
  command = "node hosting/build.mjs"
  publish = ".netlify/portfolio"

[build.environment]
  NODE_VERSION = "24"

# Keep /0/key addresses and original relative links unchanged.
[build.processing.html]
  pretty_urls = false

[functions]
  directory = "hosting/functions"

# Keep the independently published GitHub Pages project at its existing path.
# A fixed-origin function preserves GitHub's Host header without redirect loops.
[[redirects]]
  from = "/homestuck-book-club"
  to = "/.netlify/functions/book-club-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/homestuck-book-club/*"
  to = "/.netlify/functions/book-club-proxy"
  status = 200
  force = true

# The standalone projects retain their existing functions and environment values.
# The portfolio's netlify.app previews proxy through ordinary /api/ paths;
# Netlify reserves /.netlify/ paths for the project's own functions.
[[redirects]]
  from = "/api/each-all/submitImage"
  to = "/.netlify/functions/submit-image-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/api/ephemeris/horizons"
  to = "https://kvnchpl-ephemeris.netlify.app/.netlify/functions/horizons"
  status = 200
  force = true

[dev]
  framework = "#static"
  publish = ".netlify/portfolio"
  port = 4173
  autoLaunch = false
