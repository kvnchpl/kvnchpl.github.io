<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8" />
    <!-- <base href="/trellis/"> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trellis</title>
    <link rel="stylesheet" href="style/main.css" />
    <link rel="icon" href="favicon.ico" />
</head>

<body>
    <div id="top-button-bar">
        <div id="game-controls">
            <button id="new-game" class="ui-button">New Game</button>
            <span id="save-size" role="status" aria-live="polite"></span>
            <button id="download-save" class="ui-button" hidden>Download previous save</button>
            <button id="download-backup" class="ui-button" hidden>Download upgrade backup</button>
        </div>
        <div id="day-controls">
            <button id="end-day" class="ui-button">End Day</button>
        </div>
    </div>
    <div id="game-container">
        <div id="farm-view">
            <canvas id="game-canvas" tabindex="0" aria-label="Farm. Use W A S D to move, arrow keys to select, and 1 to 8 for actions."></canvas>
            <div id="touch-controls" aria-label="Farm controls">
                <div class="control-pad" role="group" aria-labelledby="move-label">
                    <h2 id="move-label">Move</h2>
                    <div class="direction-pad">
                        <button class="ui-button pad-up" data-control="up" aria-label="Move up">↑</button>
                        <button class="ui-button pad-left" data-control="left" aria-label="Move left">←</button>
                        <span class="pad-center" aria-hidden="true">•</span>
                        <button class="ui-button pad-right" data-control="right" aria-label="Move right">→</button>
                        <button class="ui-button pad-down" data-control="down" aria-label="Move down">↓</button>
                    </div>
                </div>
                <div class="control-pad" role="group" aria-labelledby="select-label">
                    <h2 id="select-label">Select tile</h2>
                    <div class="direction-pad">
                        <button class="ui-button pad-up" data-control="selectUp" aria-label="Select tile above">↑</button>
                        <button class="ui-button pad-left" data-control="selectLeft" aria-label="Select tile to the left">←</button>
                        <button class="ui-button pad-center" data-control="resetSelector" aria-label="Select current tile">Here</button>
                        <button class="ui-button pad-right" data-control="selectRight" aria-label="Select tile to the right">→</button>
                        <button class="ui-button pad-down" data-control="selectDown" aria-label="Select tile below">↓</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="info-panel">
            <div id="time-display"></div>
            <h2>Tile Info</h2>
            <img id="tile-image" src="" alt="Tile Image" />
            <div id="tile-details"></div>
            <div id="tile-actions"></div>
            <section id="plant-care" hidden aria-label="Plant care">
                <p id="growth-condition" role="status"></p>
                <details>
                    <summary>About this plant’s water needs</summary>
                    <p id="care-explanation"></p>
                    <p id="care-model-note"></p>
                    <div id="care-sources"></div>
                </details>
            </section>
        </div>
    </div>
    <div id="plant-modal-overlay" class="modal-overlay" style="display:none;">
        <div id="plant-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="plant-modal-title">
            <button id="plant-modal-cancel" class="ui-button" aria-label="Cancel planting">X</button>
            <h3 id="plant-modal-title">Select a plant</h3>
            <div id="plant-modal-buttons"></div>
        </div>
    </div>
    <div id="game-message-overlay" class="modal-overlay" style="display:none;">
        <div id="game-message-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="game-message-title" aria-describedby="game-message-content">
            <h3 id="game-message-title"></h3>
            <div id="game-message-content"></div>
            <div id="game-message-buttons">
                <button id="game-message-confirm" class="ui-button">OK</button>
                <button id="game-message-cancel" class="ui-button">Cancel</button>
            </div>
        </div>
    </div>
    <script type="module" src="script/game.js"></script>
</body>

</html>
